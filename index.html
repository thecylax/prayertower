<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torre de Oração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="hero">
      <p class="hero__eyebrow">Agenda Noah - 40 horas de Jejum e Oração</p>
      <h1 class="hero__title" id="titulo">Torre de Oração</h1>
      <p class="hero__subtitle" id="subtitulo">
        Escolha um horário e registre sua oração. Vários podem orar no mesmo horário.
      </p>
      <p class="hero__date" id="dataExibida"></p>
    </header>

    <main class="main">
      <section class="legend" aria-label="Legenda">
        <span class="legend__item"><i class="dot dot--free"></i> Vago</span>
        <span class="legend__item"><i class="dot dot--taken"></i> Com oração</span>
      </section>

      <p class="status" id="statusMsg" role="status"></p>

      <div class="agenda" id="agenda" aria-label="Horários da torre"></div>
    </main>

    <dialog class="modal" id="modalReserva">
      <form method="dialog" class="modal__form" id="formReserva">
        <header class="modal__header">
          <h2>Reservar horário</h2>
          <p class="modal__slot" id="modalSlotLabel">—</p>
        </header>

        <label class="field">
          <span>Seu nome</span>
          <input
            type="text"
            name="name"
            id="inputNome"
            required
            minlength="2"
            maxlength="80"
            autocomplete="name"
            placeholder="Nome completo"
          />
        </label>

        <label class="field">
          <span>Célula</span>
          <select name="cell" id="selectCelula" required>
            <option value="" disabled selected>Selecione a célula</option>
          </select>
        </label>

        <p class="modal__error" id="modalError" hidden></p>

        <footer class="modal__actions">
          <button type="button" class="btn btn--ghost" id="btnCancelar">
            Cancelar
          </button>
          <button type="submit" class="btn btn--primary" id="btnSalvar">
            Confirmar
          </button>
        </footer>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/cells.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
